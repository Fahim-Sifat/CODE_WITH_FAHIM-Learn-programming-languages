<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <link rel="stylesheet" href="register.css"/>
</head>
<body>
    <img src="header-logo.png" alt="header-logo"><h1>CODE WITH FAHIM</h1>

    <div class="div1">
        <h3>REGISTER</h3>
        
        <form action="register-cwf.php" method="post">
            
            <label>
                FIRST NAME:
                <input type="text" placeholder="Enter first name" class="first-name" name="first_name">
            </label>
            
            <label>
                LAST NAME:
                <input type="text" placeholder="Enter last name" class="last_name" name="last-name">
            </label>
            
            <label>
                E-MAIL:
                <input type="email" class="email" name="email" placeholder="Enter valid e-mail address">
            </label>
            
            <label>
                PASSWORD:
                <input type="password" class="password" name="password" placeholder="At least 8 characters">
            </label>
            
            <label>
                CONFIRM PASSWORD:
                <input type="password" class="cpassword" name="cpassword" placeholder="At least 8 characters">
            </label>
            
            <label>
                GENDER:
                <span class="gender-group">
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </span>
            </label>
            
            <label>
                NATIONALITY:
                <input type="text" class="nationality" name="nationality" placeholder="Country-name">
            </label>
            
            <input type="submit" value="Register" class="submit" name="register_submit">
        </form>
        
        <p class="p-login">Already have an account? <a href="signup.html" class="login">Login</a></p>
    </div>

    <a href="index.html">Back</a>
</body>
</html>
